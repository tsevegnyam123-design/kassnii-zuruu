<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GS25 — Нууц үг сэргээх</title><style>:root{font-family:system-ui,sans-serif;color:#1a2c4b;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}.bar{background:#2863e9;color:white;padding:20px;text-align:center;font-size:24px;font-weight:800}.wrap{max-width:470px;margin:40px auto;padding:16px}.panel{background:white;padding:28px;border-radius:20px;box-shadow:0 8px 30px #19376516}h1{font-size:24px;margin:0 0 10px}p{color:#63738d;line-height:1.5}label{display:block;margin:18px 0 0;font-weight:600}input{width:100%;padding:13px;border:1px solid #cdd9ea;border-radius:10px;margin-top:7px;font:inherit}button{background:#2863e9;color:white;border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;margin-top:20px;width:100%}button:disabled{opacity:.6}.hidden{display:none}.error{color:#a22525}.success{color:#145e3e}a{color:#2863e9}</style></head><body><header class="bar">GS25 · Ажилтны портал</header><main class="wrap"><div class="panel"><h1>Нууц үг сэргээх</h1><section id="request"><p>Supabase Authentication-д бүртгэлтэй и-мэйл хаягаа оруулна уу.</p><form id="requestForm"><label for="email">И-мэйл</label><input id="email" type="email" required autocomplete="email"><button id="send" type="submit">Сэргээх холбоос илгээх</button></form></section><section id="complete" class="hidden"><p>Шинэ нууц үгээ тохируулна уу.</p><form id="completeForm"><label for="password">Шинэ нууц үг (12+ тэмдэгт)</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><label for="confirm">Нууц үгээ давтах</label><input id="confirm" type="password" minlength="12" required autocomplete="new-password"><button id="save" type="submit">Нууц үг шинэчлэх</button></form></section><p id="message" role="status" aria-live="polite"></p><p><a href="/">Нэвтрэх хуудас руу буцах</a></p></div></main><script src="/reset.js" defer></script></body></html>
