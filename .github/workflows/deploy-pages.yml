name: Deploy GS25 portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - api/portal.js
      - supabase/functions/portal/index.ts
      - tests/payroll-periods.test.mjs
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Verify all 2026 payroll period and Staff salary rules
        run: node --test tests/payroll-periods.test.mjs
      - name: Smoke-test protected Supabase API (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          url="https://zxhbufwncnijmpwzokvt.supabase.co/functions/v1/portal?action=dashboard"
          code=$(curl -sS --retry 2 --max-time 20 -D /tmp/portal.headers -o /tmp/portal.body -w '%{http_code}' \
            -H 'Origin: https://tsevegnyam123-design.github.io' "$url")
          echo "Protected endpoint status: $code"
          test "$code" = "401"
          grep -qi '^access-control-allow-origin: https://tsevegnyam123-design.github.io' /tmp/portal.headers
          preflight=$(curl -sS --retry 2 --max-time 20 -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://tsevegnyam123-design.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: x-portal-session, content-type' "$url")
          echo "CORS preflight status: $preflight"
          test "$preflight" = "204"
          # Invalid synthetic login must be rejected by the database-backed PIN verifier.
          login_code=$(curl -sS --retry 2 --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: https://tsevegnyam123-design.github.io' \
            -H 'Content-Type: application/json' \
            -d '{"code":"000000000000","pin":"0000"}' \
            'https://zxhbufwncnijmpwzokvt.supabase.co/functions/v1/portal?action=login')
          echo "Invalid login status: $login_code"
          test "$login_code" = "401"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
